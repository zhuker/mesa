<!doctype html>
<!--
  One iteration in full: perf.html?iter=LABEL

  Static, and one copy of it for the whole tree. It sits at the root of
  build/iter beside the iteration directories, takes the label from the query
  string, and reads LABEL/iteration.json and the csvs under LABEL/bench/ —
  <sample>.csv, _gpu.csv and _gpu_procs.csv.

  Two data sources on purpose. Per-frame times, GPU load and GPU memory come
  straight from the csvs cp_perf_run.sh wrote, so there is one copy of them
  rather than a second in json that could drift. Per-frame differences come from
  iteration.json, because producing them takes an ffmpeg pass over the stored
  frames and they exist nowhere else.

  Served over HTTP, not opened off disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iteration detail</title>
<style>
  :root {
    --bg:#fff; --panel:#f6f7f9; --line:#dfe3e8; --fg:#14171a; --dim:#5b6570;
    --win:#0b7a3b; --winbg:#e6f4ec; --reg:#b3261e; --regbg:#fbeae9;
    --accent:#2a5db0; --warn:#8a5a00; --grid:#e8ebee; --now:#2a5db0; --prev:#9aa5b1;
    --calib:#8a5a00;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#14171a; --panel:#1c2126; --line:#2c333a; --fg:#e6eaee; --dim:#97a3ae;
    --win:#4ad07f; --winbg:#10291c; --reg:#ff7b72; --regbg:#2b1614;
    --accent:#7aa7f0; --warn:#e0b050; --grid:#242b31; --now:#7aa7f0; --prev:#5d6874;
    --calib:#e0b050;
  } }
  :root[data-theme="dark"] {
    --bg:#14171a; --panel:#1c2126; --line:#2c333a; --fg:#e6eaee; --dim:#97a3ae;
    --win:#4ad07f; --winbg:#10291c; --reg:#ff7b72; --regbg:#2b1614;
    --accent:#7aa7f0; --warn:#e0b050; --grid:#242b31; --now:#7aa7f0; --prev:#5d6874;
    --calib:#e0b050;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 20px 80px; }
  a { color:var(--accent); }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:30px 0 10px; }
  .sub { color:var(--dim); font-size:13px; }
  code,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .back { font-size:13px; display:inline-block; margin-bottom:14px; }

  .meta { color:var(--dim); font-size:12px; margin:10px 0 4px; }
  .meta span { margin-right:16px; white-space:nowrap; }
  .desc { font-size:14px; margin:6px 0 0; }
  ul.notes { margin:10px 0 0; padding-left:18px; color:var(--dim); font-size:13px; }

  .cards { display:flex; gap:12px; flex-wrap:wrap; margin:18px 0 4px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:12px 16px; min-width:150px; }
  .card .k { color:var(--dim); font-size:11px; text-transform:uppercase;
             letter-spacing:.05em; }
  .card .v { font-size:21px; font-weight:600; margin-top:2px; }

  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:right; padding:5px 9px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .pct.win { color:var(--win); font-weight:600; }
  .pct.reg { color:var(--reg); font-weight:600; }
  .pct.flat { color:var(--dim); }
  .noisy { opacity:.55; }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px;
           font-size:11px; font-weight:600; }
  .badge.ok{background:var(--winbg);color:var(--win)}
  .badge.bad{background:var(--regbg);color:var(--reg)}
  .badge.warn{background:var(--regbg);color:var(--warn)}
  .gate-bad { border-left:3px solid var(--reg); padding-left:12px; margin:14px 0; }

  .charts { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
            gap:16px; }
  .chart { border:1px solid var(--line); border-radius:10px; background:var(--panel);
           padding:10px 12px 6px; }
  .chart h3 { margin:0 0 2px; font-size:13px; font-weight:600; }
  .chart .cap { color:var(--dim); font-size:11px; margin-bottom:4px; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .empty { color:var(--dim); font-style:italic; font-size:13px; }

  /* frame inspector */
  .insp { border:1px solid var(--line); border-radius:10px; background:var(--panel);
          padding:14px 16px; }
  .ctl { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .ctl label { font-size:12px; color:var(--dim); display:flex; gap:6px;
               align-items:center; }
  .ctl select, .ctl input[type=number] { background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit;
    font-size:13px; }
  .ctl input[type=range] { width:200px; }
  .panes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:900px){ .panes{grid-template-columns:1fr;} }
  .pane { min-width:0; }
  .pane canvas, .pane img { width:100%; height:auto; display:block;
                 border:1px solid var(--line); border-radius:6px; background:#000;
                 cursor:crosshair; }
  .pane .cap { font-size:11px; color:var(--dim); margin-top:4px; }
  .pane .cap b { color:var(--fg); }
  svg .cursor { stroke:var(--fg); stroke-width:1; opacity:.45; }

  /* full-size overlay */
  /* display:flex would otherwise beat the browser's [hidden]{display:none},
     leaving the overlay permanently over the page dimming everything. */
  #full[hidden] { display:none; }
  #full { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50;
          display:flex; flex-direction:column; }
  #full-bar { display:flex; justify-content:space-between; align-items:center;
              gap:16px; padding:10px 16px; color:#e6eaee; font-size:13px;
              background:rgba(0,0,0,.6); flex:0 0 auto; }
  #full-bar button { background:transparent; border:1px solid #667; color:#e6eaee;
              border-radius:6px; padding:3px 10px; font:inherit; cursor:pointer; }
  #full-scroll { flex:1 1 auto; overflow:auto; display:flex;
                 align-items:flex-start; justify-content:center; padding:12px; }
  #full-img { max-width:none; image-rendering:pixelated; cursor:zoom-out; }
  .chart { cursor:crosshair; }
  .key { font-size:11px; color:var(--dim); }
  .key b { font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="iterations.html">&larr; all iterations</a>
  <div id="root"><p class="sub">loading…</p></div>
</div>

<div id="full" hidden onclick="if(event.target.id!=='full-img')closeFull()">
  <div id="full-bar"><span id="full-cap"></span>
    <button onclick="closeFull()">close (esc)</button></div>
  <div id="full-scroll"><img id="full-img"></div>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2 = n => n==null ? "" : n.toFixed(2);
const fmtInt = n => n==null ? "" : n.toLocaleString();

function pctSpan(p, noisy) {
  if (p == null) return '<span class="pct flat">—</span>';
  const c = p <= -5 ? "win" : p >= 5 ? "reg" : "flat";
  return `<span class="pct ${c}${noisy?" noisy":""}">${p>0?"+":""}${p.toFixed(1)}%</span>`;
}

/* A line chart of one or two series. Drawn as inline SVG rather than with a
   library so the page stays a single file with nothing to fetch. */
function lineChart(series, opts) {
  const W = 330, H = 120, L = 44, R = 6, T = 8, B = 18;
  const all = series.flatMap(s => s.data).filter(v => v != null);
  if (!all.length) return '<p class="empty">no data</p>';
  const n = Math.max(...series.map(s => s.data.length));
  let hi = Math.max(...all), lo = opts && opts.zero === false ? Math.min(...all) : 0;
  if (hi === lo) hi = lo + 1;
  const x = i => L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const fmt = opts && opts.fmt ? opts.fmt : (v => v.toFixed(1));

  let g = "";
  for (let k = 0; k <= 2; k++) {
    const v = lo + (hi - lo) * k / 2, yy = y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--grid)"/>
          <text x="${L-6}" y="${yy+3.5}" text-anchor="end" font-size="9"
                fill="var(--dim)">${esc(fmt(v))}</text>`;
  }
  g += `<text x="${L}" y="${H-4}" font-size="9" fill="var(--dim)">0</text>
        <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="9"
              fill="var(--dim)">${n-1}</text>
        <line class="cursor" x1="0" y1="${T}" x2="0" y2="${H-B}"
              visibility="hidden"/>`;

  for (const s of series) {
    if (!s.data.length) continue;
    const d = s.data.map((v, i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.6}"
             ${s.dash?'stroke-dasharray="3,3"':''} stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

/* bench/<sample>.csv: two header lines, then `frame,ms`, then the rows. */
function parseFrameCsv(text) {
  const out = [];
  let started = false;
  for (const line of text.split("\n")) {
    if (line.startsWith("frame,")) { started = true; continue; }
    if (!started) continue;
    const p = line.trim().split(",");
    if (p.length === 2) { const v = parseFloat(p[1]); if (!isNaN(v)) out.push(v); }
  }
  return out;
}

/* --- GPU load and memory --------------------------------------------------
   Both samplers in cp_perf_run.sh run for the whole pass rather than per
   sample, because several samples finish in well under a second and a
   per-sample capture would get a single poll. So a sample's slice has to be cut
   out by time, and _gpu_procs.csv is what makes that possible: it names the
   process behind each poll, and the sample name is the binary's name.

   Only the timed pass is read. Utilisation over a storing pass is mostly the
   10 ms an image write costs. */

/* bench/_gpu.csv: nvidia-smi's own csv, no header and units in the fields —
   timestamp, utilization.gpu, utilization.memory, memory.used, memory.total,
   power.draw, at 2 Hz. */
function parseGpuCsv(text) {
  const out = [];
  for (const line of text.split("\n")) {
    const p = line.split(",");
    if (p.length < 5) continue;
    const m = p[0].trim().match(/^(\d{4})\/(\d\d)\/(\d\d) (\d\d):(\d\d):(\d\d)\.(\d+)/);
    if (!m) continue;
    const t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6],
                       +m[7].slice(0, 3)).getTime() / 1000;
    const util = parseFloat(p[1]), mem = parseFloat(p[3]);
    if (isNaN(util) || isNaN(mem)) continue;
    out.push({t, util, mem});
  }
  return out;
}

/* bench/_gpu_procs.csv: epoch, pid, process name, used memory — one line per
   process per poll, and no line at all while nothing is on the card. */
function parseProcCsv(text) {
  const out = {};
  for (const line of text.split("\n")) {
    const p = line.split(",");
    if (p.length < 4) continue;
    const t = parseFloat(p[0]), mem = parseFloat(p[3]);
    const name = p[2].trim().replace(/^.*\//, "");
    if (isNaN(t) || !name) continue;
    const e = out[name] || (out[name] = {t0: t, t1: t, mem: 0});
    if (t < e.t0) e.t0 = t;
    if (t > e.t1) e.t1 = t;
    if (!isNaN(mem) && mem > e.mem) e.mem = mem;
  }
  return out;
}

/* The two files keep different clocks: nvidia-smi prints the machine's local
   wall clock, the process sampler prints epoch seconds. Parsed here they agree,
   because the page is served from the machine that ran the pass — but a browser
   in another timezone reads the first one hours off, no window overlaps
   anything, and every sample would silently report no data. A disagreement far
   larger than the half second between the two samplers starting is that, and is
   corrected; anything smaller is real skew and is left alone. */
function clockOffset(gpu, procs) {
  const starts = Object.values(procs).map(w => w.t0);
  if (!gpu.length || !starts.length) return 0;
  const d = Math.min(...starts) - gpu[0].t;
  return Math.abs(d) < 120 ? 0 : Math.round(d / 900) * 900;
}

/* Per sample: mean and peak load over its slice of the pass, and the most GPU
   memory in use while it ran.

   The load figures trim the window the way cp_gpu_busy.sh does — the polls
   before the first and after the last with the GPU doing anything are start-up,
   shader compilation and teardown, and then a tenth is dropped off each end for
   the ramp. The memory figures do not: a sample that allocates up front and
   never touches it again is still holding it, and that is the number wanted.

   At 2 Hz a short sample yields a handful of polls, so the poll count is
   reported beside the mean rather than left for the reader to assume. */
function gpuStats(gpu, procs) {
  const off = clockOffset(gpu, procs), out = {};
  for (const [name, w] of Object.entries(procs)) {
    const win = gpu.filter(g => g.t + off >= w.t0 && g.t + off <= w.t1);
    if (!win.length) { out[name] = {secs: w.t1 - w.t0, ownMb: w.mem, polls: 0}; continue; }
    let lo = 0, hi = win.length - 1;
    while (lo <= hi && !win[lo].util) lo++;
    while (hi >= lo && !win[hi].util) hi--;
    const live = win.slice(lo, hi + 1);
    const trim = Math.floor(live.length * 0.1);
    const core = trim && live.length - 2 * trim >= 10
               ? live.slice(trim, live.length - trim) : live;
    out[name] = {
      secs: w.t1 - w.t0,
      polls: core.length,
      mean: core.length ? core.reduce((a, g) => a + g.util, 0) / core.length : null,
      peak: core.length ? Math.max(...core.map(g => g.util)) : null,
      memMb: Math.max(...win.map(g => g.mem)),
      ownMb: w.mem,
    };
  }
  return out;
}

function gpuTable(r, stats, order) {
  const names = order.filter(s => stats[s])
    .concat(Object.keys(stats).filter(s => !order.includes(s)).sort());
  if (!names.length) return "";
  const rows = names.map(s => {
    /* cp_gpu_busy.sh refuses to report a window under six seconds of steady
       state; this sampler is half its rate, so that is twelve polls. Greyed
       rather than withheld, because this run happened anyway and a thin figure
       still says which end of the scale a sample is at. */
    const g = stats[s], thin = g.polls < 12;
    return `<tr class="${thin ? "noisy" : ""}">
      <td><code>${esc(s)}</code></td>
      <td>${g.mean != null ? g.mean.toFixed(0) + "%" : "—"}</td>
      <td>${g.peak != null ? g.peak.toFixed(0) + "%" : "—"}</td>
      <td>${g.memMb != null ? fmtInt(Math.round(g.memMb)) : "—"}</td>
      <td>${g.ownMb ? fmtInt(Math.round(g.ownMb)) : "—"}</td>
      <td>${g.secs.toFixed(1)}</td>
      <td>${g.polls}</td></tr>`;
  }).join("");
  return `<div class="scroll"><table><thead><tr>
    <th>sample</th><th title="mean utilization.gpu over the trimmed window">load</th>
    <th>peak</th><th title="memory.used, the whole card">gpu ram MiB</th>
    <th title="this process's own GPU memory, from _gpu_procs.csv">its own</th>
    <th title="how long the sample held a context on the card">window s</th>
    <th title="polls of the 2 Hz sampler the load figures average">polls</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function costTable(r) {
  const samples = Object.keys(r.cost || {}).sort(
    (a,b) => (r.cost[b].ms_avg||0) - (r.cost[a].ms_avg||0));
  const rows = samples.map(s => {
    const c = r.cost[s], d = (r.delta||{})[s], v = ((r.correctness||{}).samples||{})[s]||{};
    const vb = v.verdict === "ok" ? '<span class="badge ok">ok</span>'
             : v.verdict === "REGRESSED" ? '<span class="badge bad">regressed</span>'
             : v.verdict ? `<span class="badge warn">${esc(v.verdict)}</span>` : "";
    return `<tr>
      <td><code>${esc(s)}</code></td>
      <td>${f2(c.ms_avg)}</td><td>${f2(c.ms_best)}</td><td>${f2(c.ms_worst)}</td>
      <td>${d?f2(d.before):""}</td><td>${d?pctSpan(d.pct,d.noisy):"—"}</td>
      <td>${v.frame0!=null?fmtInt(v.frame0):""}</td>
      <td>${v.worst!=null?fmtInt(v.worst):""}</td>
      <td>${v.at!=null?v.at:""}</td>
      <td style="text-align:left">${vb}</td></tr>`;
  }).join("");
  return `<div class="scroll"><table><thead><tr>
    <th>sample</th><th>ms</th><th>best</th><th>worst</th><th>before</th><th>change</th>
    <th>frame 0</th><th>worst diff</th><th>at</th><th style="text-align:left">verdict</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* --- frame inspector ------------------------------------------------------
   The frames are PNG, converted in place from the PPM the sweep writes and
   sitting in the sample directory the correctness gate reads — so the pane is
   pointed at the very file that was judged, not at a second copy of it. Full
   resolution and lossless on purpose: the page exists to say whether a pixel
   is wrong, and neither a resample nor a JPEG artefact can be told from one.

   The reference frames live under the reference's own directory and are shared
   by every iteration, since NVIDIA's output does not change when cudavk does.

   The difference pane is drawn here rather than exported, so that the gain is
   a live control rather than a decision taken at export time. */

function framePath(r, sample, n, dirLabel) {
  const m = (r.frames_meta || {})[sample];
  if (!m) return null;
  return `${encodeURIComponent(dirLabel)}/${encodeURIComponent(sample)}/` +
         `${m.prefix}${String(n).padStart(m.digits, "0")}${m.ext}`;
}

const IMGCACHE = new Map();
function loadImg(src) {
  if (IMGCACHE.has(src)) return IMGCACHE.get(src);
  const p = new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("missing " + src));
    im.src = src;
  });
  IMGCACHE.set(src, p);
  return p;
}

/* Pixels of an image, via an offscreen canvas. Same origin, so the canvas is
   not tainted and getImageData is allowed. */
const PIXCACHE = new Map();
function pixels(im, src) {
  if (PIXCACHE.has(src)) return PIXCACHE.get(src);
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const cx = c.getContext("2d", {willReadFrequently: true});
  cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, c.width, c.height);
  PIXCACHE.set(src, d);
  return d;
}

/* |a - b| per channel, brightened. The old report did this with ffmpeg's
   colorlevels, and warned that eq=contrast is not a gain because it pivots
   around mid grey; a plain multiply is what was meant. */
function drawDiff(cv, a, b, gain) {
  cv.width = a.width; cv.height = a.height;
  const out = cv.getContext("2d").createImageData(a.width, a.height);
  const d = out.data, x = a.data, y = b.data;
  for (let i = 0; i < d.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const v = Math.abs(x[i+c] - y[i+c]) * gain;
      d[i+c] = v > 255 ? 255 : v;
    }
    d[i+3] = 255;
  }
  cv.getContext("2d").putImageData(out, 0, 0);
}

function inspector(r) {
  const meta = r.frames_meta || {};
  const ref = r.reference || "nvidia", calib = r.calibration || "";
  const samples = Object.keys(meta).sort();
  if (!samples.length)
    return `<p class="empty">no stored frames for this iteration — it was run
      with BENCH_ONLY, or cp_iter_report.py record has not seen them</p>`;
  const opts = samples.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  return `<div class="insp">
    <div class="ctl">
      <label>sample <select id="i-sample">${opts}</select></label>
      <label>frame <input type="range" id="i-frame" min="0" max="59" value="0">
        <input type="number" id="i-frameno" min="0" max="59" value="0" style="width:64px"></label>
      <label>difference gain <input type="range" id="i-gain" min="1" max="40" value="12">
        <span id="i-gainv" class="mono">12x</span></label>
    </div>
    <div class="panes">
      <div class="pane"><img id="i-ref" data-full="">
        <div class="cap"><b>${esc(ref)}</b> reference</div></div>
      <div class="pane"><img id="i-test" data-full="">
        <div class="cap"><b>${esc(r.label)}</b> — hover to flip to ${esc(ref)}</div></div>
      ${calib ? `<div class="pane"><img id="i-calib" data-full="">
        <div class="cap"><b>${esc(calib)}</b> — hover to flip to ${esc(ref)}</div></div>` : ""}
      <div class="pane" style="grid-column:1"><div class="cap" style="margin:0">
        Click any frame for it at full size, where the same hover works.</div></div>
      <div class="pane"><canvas id="i-diff"></canvas>
        <div class="cap" id="i-diffcap">difference</div></div>
      ${calib ? `<div class="pane"><canvas id="i-cdiff"></canvas>
        <div class="cap" id="i-cdiffcap">difference</div></div>` : ""}
    </div></div>`;
}

function wireInspector(r) {
  const meta = r.frames_meta || {};
  const el = id => document.getElementById(id);
  const selS = el("i-sample"), rng = el("i-frame"), num = el("i-frameno"),
        gain = el("i-gain"), gainv = el("i-gainv");
  if (!selS) return;
  let cur = {sample: selS.value, frame: 0, ref: null, test: null};

  function cursors() {
    document.querySelectorAll(".chart").forEach(ch => {
      const line = ch.querySelector(".cursor");
      if (!line) return;
      const n = +ch.dataset.n || 60;
      if (ch.dataset.sample !== cur.sample) { line.setAttribute("visibility","hidden"); return; }
      const L = 44, R = 6, W = 330;
      const x = L + (n <= 1 ? 0 : (cur.frame / (n - 1)) * (W - L - R));
      line.setAttribute("x1", x); line.setAttribute("x2", x);
      line.setAttribute("visibility", "visible");
    });
  }

  async function show() {
    const s = cur.sample, n = cur.frame, m = meta[s];
    if (!m) return;
    rng.max = num.max = Math.max(0, (m.count || 60) - 1);
    const REF = r.reference || "nvidia", CAL = r.calibration || "";
    const rp = framePath(r, s, n, REF), tp = framePath(r, s, n, r.label);
    const cp = CAL ? framePath(r, s, n, CAL) : null;
    el("i-ref").src = rp;   el("i-ref").dataset.full = rp;
    el("i-test").src = tp;  el("i-test").dataset.full = tp;
    if (cp && el("i-calib")) { el("i-calib").src = cp; el("i-calib").dataset.full = cp; }
    cur.refSrc = rp; cur.testSrc = tp; cur.calibSrc = cp;
    try {
      const imgs = await Promise.all(
        [loadImg(rp), loadImg(tp)].concat(cp ? [loadImg(cp)] : []));
      if (cur.sample !== s || cur.frame !== n) return;   /* superseded */
      cur.ref = pixels(imgs[0], rp); cur.test = pixels(imgs[1], tp);
      drawDiff(el("i-diff"), cur.ref, cur.test, +gain.value);
      const d = (r.frame_diff || {})[s];
      el("i-diffcap").innerHTML = `<b>${esc(r.label)}</b> &minus; ${esc(REF)},
        &times;${gain.value}` +
        (d && d[n] != null ? ` · <b>${fmtInt(d[n])}</b> px over tol
          ${r.tolerance || 8}` : "");
      if (cp && el("i-cdiff")) {
        cur.calib = pixels(imgs[2], cp);
        drawDiff(el("i-cdiff"), cur.ref, cur.calib, +gain.value);
        const c = (r.calib_diff || {})[s];
        el("i-cdiffcap").innerHTML = `<b>${esc(CAL)}</b> &minus; ${esc(REF)},
          &times;${gain.value}` +
          (c && c[n] != null ? ` · <b>${fmtInt(c[n])}</b> px over tol
            ${r.tolerance || 8}` : "");
      }
    } catch (e) {
      el("i-diffcap").textContent = "could not load frame — has "
        + "cp_iter_report.py record run for it? (" + e.message + ")";
    }
  }

  function set(sample, frame) {
    if (sample) { cur.sample = sample; selS.value = sample; }
    const m = meta[cur.sample];
    const max = Math.max(0, ((m && m.count) || 60) - 1);
    cur.frame = Math.max(0, Math.min(max, frame|0));
    rng.value = num.value = cur.frame;
    cursors(); show();
  }

  selS.onchange = () => set(selS.value, 0);
  rng.oninput = () => set(null, +rng.value);
  num.oninput = () => set(null, +num.value);
  gain.oninput = () => { gainv.textContent = gain.value + "x";
    if (cur.ref && cur.test) drawDiff(el("i-diff"), cur.ref, cur.test, +gain.value);
    if (cur.ref && cur.calib && el("i-cdiff"))
      drawDiff(el("i-cdiff"), cur.ref, cur.calib, +gain.value); };

  /* Hover the test pane to flip it to the reference, as the old report did:
     the eye is far better at spotting a change between two images in the same
     place than at comparing two images side by side. */
  /* Hover a renderer's frame to flip it to the reference, as the old report
     did: the eye is far better at spotting a change between two images in the
     same place than at comparing two side by side. */
  for (const [id, key] of [["i-test","testSrc"], ["i-calib","calibSrc"]]) {
    const im = el(id);
    if (!im) continue;
    im.onmouseenter = () => { if (cur.refSrc) im.src = cur.refSrc; };
    im.onmouseleave = () => { if (cur[key]) im.src = cur[key]; };
  }

  /* Full size, where the same hover works. A pane is a third of the page wide,
     which is a sixth of the frame — enough to see that something moved and not
     enough to see what. */
  document.querySelectorAll(".pane img").forEach(im => {
    im.onclick = () => openFull(im.dataset.full, cur.refSrc,
      im.id === "i-ref" ? "" : (im.id === "i-calib" ? cur.calibSrc : cur.testSrc),
      `${cur.sample} frame ${cur.frame} — ` +
      (im.id === "i-ref" ? (r.reference || "nvidia")
       : im.id === "i-calib" ? (r.calibration || "") : r.label));
  });

  /* Click a chart to send the panes there. */
  document.querySelectorAll(".chart[data-sample]").forEach(ch => {
    ch.addEventListener("click", e => {
      const svg = ch.querySelector("svg");
      if (!svg) return;
      const b = svg.getBoundingClientRect();
      const L = 44, R = 6, W = 330;
      const x = (e.clientX - b.left) / b.width * W;
      const n = +ch.dataset.n || 60;
      const f = Math.round((x - L) / (W - L - R) * (n - 1));
      set(ch.dataset.sample, f);
      document.querySelector(".insp").scrollIntoView({behavior:"smooth", block:"center"});
    });
  });

  /* A frame is worth linking to. ?sample=&frame= opens the inspector straight
     on one, which is how a finding gets pointed at rather than described. */
  const q = new URLSearchParams(location.search);
  const qs = q.get("sample"), qf = +(q.get("frame") || 0);
  set(qs && meta[qs] ? qs : selS.value, qf || 0);

  /* &full=test|calib|ref opens that pane at full size straight away, so a
     finding can be linked at the resolution it has to be judged at. */
  const qfull = q.get("full");
  if (qfull) {
    const im = el(qfull === "ref" ? "i-ref"
              : qfull === "calib" ? "i-calib" : "i-test");
    if (im) setTimeout(() => im.click(), 0);
  }
}

/* Full-size overlay. Natural resolution, scrollable, and hovering still flips
   to the reference for anything that is not the reference. */
function openFull(src, refSrc, ownSrc, caption) {
  const ov = document.getElementById("full");
  const im = document.getElementById("full-img");
  document.getElementById("full-cap").textContent = caption +
    (ownSrc ? " · hover to flip to the reference" : "");
  im.src = src;
  im.onmouseenter = () => { if (ownSrc && refSrc) im.src = refSrc; };
  im.onmouseleave = () => { if (ownSrc) im.src = ownSrc; };
  ov.hidden = false;
  document.body.style.overflow = "hidden";
}
function closeFull() {
  document.getElementById("full").hidden = true;
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeFull(); });

function render(r, csvs, gstats) {
  const c = r.correctness || {};
  const samples = Object.keys(r.cost || {}).sort(
    (a,b) => (r.cost[b].ms_avg||0) - (r.cost[a].ms_avg||0));

  const gateWarn = c.gate_ran ? "" : `<div class="gate-bad"><b>The correctness gate
    did not run for this iteration.</b> Its cost numbers are unguarded.</div>`;
  const changed = c.changed_vs_against || [];
  const changedHtml = changed.length ? `<div class="gate-bad"><b>Verdict changed
    against ${esc(r.against)}:</b> ` + changed.map(x =>
    `<code>${esc(x.sample)}</code> ${esc(x.was)} &rarr; ${esc(x.now)}`).join(", ")
    + `</div>` : "";

  // Frame time per frame, this iteration against the one it was compared to is
  // not available per-frame (only the mean is), so this shows this run's shape
  // with its own mean as the flat reference.
  const timeCharts = samples.map(s => {
    const d = csvs[s] || [];
    if (!d.length) return "";
    const mean = d.reduce((a,b)=>a+b,0)/d.length;
    return `<div class="chart" data-sample="${esc(s)}" data-n="${d.length}">
      <h3>${esc(s)}</h3>
      <div class="cap">${f2(mean)} ms mean · ${d.length} frames</div>
      ${lineChart([
        {data:d, color:"var(--now)"},
        {data:d.map(()=>mean), color:"var(--prev)", w:1, dash:true}
      ], {fmt:v=>v.toFixed(1)})}
      <div class="key"><b style="color:var(--now)">—</b> ms/frame
        <b style="color:var(--prev)">- -</b> mean</div></div>`;
  }).join("");

  const fd = r.frame_diff || {}, cd = r.calib_diff || {}, calib = r.calibration;
  const diffCharts = samples.filter(s => (fd[s]||[]).length).map(s => {
    const d = fd[s], c = cd[s] || [];
    const worst = Math.max(...d), at = d.indexOf(worst);
    const cw = c.length ? Math.max(...c) : null;
    const series = [{data:d, color:"var(--reg)"}];
    if (c.length) series.push({data:c, color:"var(--calib)", w:1.3, dash:true});
    return `<div class="chart" data-sample="${esc(s)}" data-n="${d.length}">
      <h3>${esc(s)}</h3>
      <div class="cap">worst ${fmtInt(worst)} px at frame ${at}${
        cw != null ? ` · ${esc(calib)} ${fmtInt(cw)}` : ""}</div>
      ${lineChart(series, {fmt:v=>
        v>=1000 ? (v/1000).toFixed(0)+"k" : v.toFixed(0)})}
      ${c.length ? `<div class="key"><b style="color:var(--reg)">—</b> ${
        esc(r.label)} <b style="color:var(--calib)">- -</b> ${esc(calib)}</div>` : ""}
      </div>`;
  }).join("");

  document.getElementById("root").innerHTML = `
    <h1><code>${esc(r.label)}</code></h1>
    <p class="desc">${esc(r.description || "no description recorded")}</p>
    <div class="meta">
      <span>commit <code>${esc((r.commit||"").slice(0,11)) || "—"}</code></span>
      <span>${esc(r.driver||"")}, ${r.frames||"?"} frames</span>
      <span>vs <code>${esc(r.against||"—")}</code></span>
      <span>recorded ${esc(r.recorded||"")}</span>
      ${(r.dirty||[]).length ? `<span style="color:var(--warn)">uncommitted: ${
        r.dirty.map(esc).join(", ")}</span>`:""}
    </div>
    ${r.commit_subject ? `<div class="meta"><span>${esc(r.commit_subject)}</span></div>`:""}
    ${(r.notes||[]).length ? "<ul class='notes'>"+r.notes.map(n=>"<li>"+esc(n)+"</li>").join("")+"</ul>":""}

    <div class="cards">
      <div class="card"><div class="k">total</div><div class="v">${f2(r.total_ms)} ms</div></div>
      <div class="card"><div class="k">vs ${esc(r.against||"—")}</div>
        <div class="v">${r.total_pct!=null?pctSpan(r.total_pct):"—"}</div></div>
      <div class="card"><div class="k">wins / regressions</div>
        <div class="v"><span class="pct win">${(r.wins||[]).length}</span>
          / <span class="pct reg">${(r.regressions||[]).length}</span></div></div>
      <div class="card"><div class="k">correctness</div><div class="v" style="font-size:15px">
        ${c.gate_ran ? (changed.length
          ? `<span class="badge bad">${changed.length} changed</span>`
          : '<span class="badge ok">unchanged</span>')
        : '<span class="badge warn">gate did not run</span>'}</div></div>
    </div>
    ${gateWarn}${changedHtml}

    <h2>Cost and correctness by sample</h2>
    ${costTable(r)}

    <h2>GPU load and memory by sample</h2>
    <p class="sub">From the timed pass's own samplers at 2 Hz, cut to each
      sample's slice of the run by the process names in
      <code>bench/_gpu_procs.csv</code>. <b>Load</b> is the mean fraction of the
      interval a kernel was resident, over the window trimmed the way
      <code>cp_gpu_busy.sh</code> trims it — the idle ends dropped, then a tenth
      off each end for the ramp — so it is the render loop rather than the
      process. <b>Gpu ram</b> is the whole card's <code>memory.used</code> while
      the sample ran and <b>its own</b> is that process's share, untrimmed,
      because memory held is held whether it is touched or not. Rows greyed out
      average fewer than twelve polls — under the six seconds of steady state
      <code>cp_gpu_busy.sh</code> refuses to report below — and say which end of
      the scale a sample is at rather than a figure;
      <code>cp_gpu_busy.sh SAMPLE 20</code> is how one of those gets an
      answer.</p>
    ${gpuTable(r, gstats, samples) || `<p class="empty">no GPU samples for this
      iteration — <code>bench/_gpu.csv</code> or
      <code>bench/_gpu_procs.csv</code> is missing or empty, which is also what a
      pass on a driver that never touches the card looks like</p>`}

    <h2>Frame time over the run</h2>
    <p class="sub">Every frame of the timed pass, in order. The mean is the
      number in the table above; the shape is what it hides — a warm-up frame, a
      periodic stall, or a sample that drifts.</p>
    <div class="charts">${timeCharts || '<p class="empty">no per-frame csvs found</p>'}</div>

    <h2>Differing pixels over the animation</h2>
    <p class="sub">Against ${esc(r.reference||"nvidia")} at tolerance
      ${r.tolerance||8}/255, every frame — not frame 0. Each chart is scaled to
      itself, because a shared axis flattens every small one and the small ones
      are where the signal is.${r.calibration ? ` The dashed line is
      <b>${esc(r.calibration)}</b> against the same reference: a residual both
      software renderers have is what software rasterization costs, and one only
      this driver has is a defect. Judge against that line, not against zero.`
      : ""}</p>
    <div class="charts">${diffCharts || `<p class="empty">no per-frame differences
      recorded — re-run <code>cp_iter_report.py record</code> without
      <code>--no-diffs</code></p>`}</div>

    <h2>Frame inspector</h2>
    <p class="sub">Click any chart above to bring that sample and frame here, or
      link to one directly with
      <code>?iter=${esc(r.label)}&amp;sample=NAME&amp;frame=N</code>, adding
      <code>&amp;full=test</code> to open it at full size.
      Hover this iteration's frame to flip it to the reference. The frames are
      the full-resolution frames the correctness gate judged. Click a pane to
      open that frame on its own.</p>
    ${inspector(r)}`;
}

const LABEL = new URLSearchParams(location.search).get("iter") || "";
document.title = LABEL ? LABEL + " — iteration" : "iteration";

if (!LABEL) {
  document.getElementById("root").innerHTML = `<div class="gate-bad">
    <p><b>No iteration named.</b></p>
    <p class="empty">This page takes one from the query string, as
    <code>perf.html?iter=LABEL</code>. Pick one from
    <a href="iterations.html">the summary</a>.</p></div>`;
} else {
  const dir = encodeURIComponent(LABEL);
  fetch(`${dir}/iteration.json`, {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status+" "+r.statusText); return r.json(); })
    .then(async rec => {
      // Per-frame times, GPU load and GPU memory come from the csvs
      // cp_perf_run.sh already wrote, so they are not duplicated into the json.
      // One fetch per sample plus the two pass-wide ones, all parallel.
      const names = Object.keys(rec.cost || {});
      const csvs = {};
      const text = p => fetch(`${dir}/bench/${p}`, {cache:"no-store"})
        .then(r => r.ok ? r.text() : "").catch(() => "");
      const [gpuText, procText] = await Promise.all([
        text("_gpu.csv"), text("_gpu_procs.csv"),
        ...names.map(s => text(`${encodeURIComponent(s)}.csv`)
          .then(t => { if (t) csvs[s] = parseFrameCsv(t); })),
      ]);
      render(rec, csvs, gpuStats(parseGpuCsv(gpuText), parseProcCsv(procText)));
      wireInspector(rec);
    })
    .catch(e => {
      document.getElementById("root").innerHTML = `<div class="gate-bad">
        <p><b>Could not load <code>${esc(LABEL)}/iteration.json</code></b> — ${
          esc(e.message)}</p>
        <p class="empty">Either there is no iteration by that name, or
        <code>cp_iter_report.py record</code> has not run for it. This page also
        reads its data at load time, so it has to be served over HTTP rather
        than opened from a <code>file://</code> URL.</p></div>`;
    });
}
</script>
</body>
</html>
